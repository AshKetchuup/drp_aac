name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_tts: ^4.0.2
  http: ^1.6.0
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  archive: ^4.0.9
  file_picker: ^12.0.0-beta.5
  flutter_appauth: ^12.0.1
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^4.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation for every platform. Source lives in assets/icon/icon.png.
# Run `dart run flutter_launcher_icons` after changing the source image.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  # Solid background so the icon is filled (the source has no alpha channel).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/arasaac/
    - assets/boards/
