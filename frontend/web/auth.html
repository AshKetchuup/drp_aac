<!DOCTYPE html>
<html>
<head>
    <title>Authentication complete</title>
</head>
<body>
    <p>Authentication is complete. If this does not happen automatically, please close the window.</p>
    <script>
      // Clean up the URL string
      const callbackUrl = window.location.href;

      if (window.opener) {
        // Send the raw URL string directly using '*' to guarantee delivery to the parent window
        window.opener.postMessage(callbackUrl, '*');
        window.close();
      } else {
        // Fallback for strict browser environments
        window.localStorage.setItem('flutter-web-auth-2', callbackUrl);
        window.close();
      }
    </script>
</body>
</html>
